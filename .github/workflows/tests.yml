name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Compile application
        run: python -m compileall -q app scripts job_search_agent.py
      - name: Run offline test suite
        run: python -m pytest -vv tests/

  package:
    name: Build installable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source archive
        run: python -m pip install --upgrade build twine && python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          WHEEL="$(realpath dist/*.whl)"
          python -m venv "$RUNNER_TEMP/job-atlas-smoke"
          "$RUNNER_TEMP/job-atlas-smoke/bin/python" -m pip install "$WHEEL"
          cd "$RUNNER_TEMP"
          JOB_ATLAS_HOME="$RUNNER_TEMP/job-atlas-home" \
            "$RUNNER_TEMP/job-atlas-smoke/bin/job-atlas" setup \
            --skills-dir "$RUNNER_TEMP/job-atlas-skills"
          JOB_ATLAS_HOME="$RUNNER_TEMP/job-atlas-home" \
            "$RUNNER_TEMP/job-atlas-smoke/bin/job-atlas" doctor \
            --skills-dir "$RUNNER_TEMP/job-atlas-skills"
      - uses: actions/upload-artifact@v4
        with:
          name: job-atlas-dist
          path: dist/*
