<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Your search, stage by stage</title>
  <desc id="desc">One: plan your search. Two: collect and screen jobs. Three: build job and company context. Four: optionally add deeper research with an approved scope and cost. Five: shortlist and export. Six: optionally tailor resumes or find LinkedIn profile links. Interview practice and outreach drafts are separate companion workflows.</desc>
  <rect width="1200" height="570" rx="20" fill="#f3f6ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="49" font-size="30" font-weight="700" fill="#193c30">Your search, stage by stage</text>
    <text x="32" y="80" font-size="18" fill="#536a5a">Start with a reviewed plan. Choose how far to go.</text>

    <g transform="translate(32 108)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">01</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Plan your search</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Share your roles and preferences.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Review the boards before collection.</text>
    </g>
    <g transform="translate(419 108)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">02</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Collect &amp; screen jobs</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Bring listings together.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Review fit, duplicates, and unknowns.</text>
    </g>
    <g transform="translate(806 108)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">03</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Build the context</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Read requirements and skills.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Understand the employer and team.</text>
    </g>

    <g transform="translate(32 312)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">04</text>
      <rect x="238" y="24" width="104" height="27" rx="13" fill="#f6e8c9"/>
      <text x="290" y="42" text-anchor="middle" font-size="12" font-weight="700" letter-spacing=".8" fill="#755421">OPTIONAL</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Add deeper research</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Choose ratings or salary evidence.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Review the scope and cost first.</text>
    </g>
    <g transform="translate(419 312)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">05</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Shortlist &amp; export</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Keep the jobs you want to pursue.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Review the dashboard and workbook.</text>
    </g>
    <g transform="translate(806 312)">
      <rect width="362" height="182" rx="14" fill="#ffffff" stroke="#d5dfcf"/>
      <rect x="20" y="18" width="40" height="38" rx="10" fill="#e6efdc"/>
      <text x="40" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#355d43">06</text>
      <rect x="238" y="24" width="104" height="27" rx="13" fill="#f6e8c9"/>
      <text x="290" y="42" text-anchor="middle" font-size="12" font-weight="700" letter-spacing=".8" fill="#755421">OPTIONAL</text>
      <text x="20" y="90" font-size="24" font-weight="700" fill="#1d3c30">Prepare your next step</text>
      <text x="20" y="124" font-size="17" fill="#536a5a">Tailor resumes or find profile links.</text>
      <text x="20" y="150" font-size="17" fill="#536a5a">Use your chosen jobs and companies.</text>
    </g>
    <text x="32" y="539" font-size="17" fill="#536a5a">Interview practice and outreach drafts are separate workflows you can start when needed.</text>
  </g>
</svg>
